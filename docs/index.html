<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTP Packaging Library</title><style>:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f6f6f4;color:#151515}*{box-sizing:border-box}body{margin:0}header{background:#151515;color:#fff;padding:16px max(19px,calc((100vw - 1050px)/2));display:flex;align-items:center;gap:12px;font-weight:800}header b{background:#ffcf00;color:#111;padding:11px 9px;border-radius:9px}.headertext small{display:block;font-size:9px;letter-spacing:.18em;color:#ffcf00;margin-top:3px}main{max-width:1090px;margin:0 auto;padding:40px 20px}h1{font-size:clamp(26px,5vw,40px);letter-spacing:-.055em;margin:0 0 7px}p{color:#737373;font-size:13px}.search{margin-top:25px;border:1px solid #e4e4df;border-radius:12px;padding:13px 16px;font-size:14px;width:100%;max-width:570px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:15px;margin-top:24px}.card{background:#fff;padding:21px;border:1px solid #ecece8;border-radius:16px;text-decoration:none;color:inherit;min-height:163px;display:flex;flex-direction:column;justify-content:space-between}.card:hover{border-color:#ffcf00;box-shadow:0 8px 25px #0000000d}.id{font-size:10px;font-weight:800;color:#81817e;letter-spacing:.09em}.name{font-size:20px;font-weight:800;letter-spacing:-.035em;margin:8px 0 5px}.meta{font-size:12px;color:#6b6b68}.open{font-size:12px;font-weight:800;margin-top:18px}.open span{background:#ffcf00;padding:8px 11px;border-radius:8px;display:inline-block}.empty{font-size:13px;margin-top:20px;color:#777}
.card{position:relative;flex-direction:row;align-items:stretch;gap:12px;overflow:hidden}
.cardInfo{display:flex;flex-direction:column;justify-content:space-between;flex:1;min-width:0;position:relative;z-index:1}
.cardInfo .name{overflow-wrap:anywhere}
.cardThumb{flex:0 0 42%;align-self:stretch;min-width:0;display:flex;align-items:center;justify-content:center;margin:-8px -7px -8px 0;background:#f8f8f6;border-radius:12px;overflow:hidden}
.cardThumb img{display:block;width:100%;height:100%;max-height:180px;object-fit:contain;object-position:center;padding:8px;transition:transform .22s ease}
.card:hover .cardThumb img{transform:scale(1.045)}
.cardThumbEmpty{font-size:10px;text-align:center;color:#a7a7a2;padding:12px}
@media(max-width:370px){.card{padding:16px;gap:8px}.cardThumb{flex-basis:38%}.name{font-size:18px}.meta{font-size:11px}}
header .adminShortcut{display:inline-flex;align-items:center;justify-content:center;background:#ffcf00;color:#111;padding:11px 10px;border-radius:9px;text-decoration:none;font-weight:950;letter-spacing:-.06em;min-height:40px;transition:filter .15s}header .adminShortcut:hover{filter:brightness(1.07)}header .adminShortcut:focus-visible{outline:3px solid #fff;outline-offset:3px}</style></head><body><header><a class="adminShortcut" href="./admin/" aria-label="Open CTP Admin" title="CTP">CTP</a><div class="headertext">Packaging<small>LIBRARY</small></div></header><main><h1>Packaging Library</h1><p>Structural packaging references.</p><input id="search" class="search" placeholder="Search project name, ID, board or dimensions" aria-label="Search projects"><div class="cards" id="cards"></div><p class="empty" id="status"></p></main><script>
const cards=document.getElementById('cards'),status=document.getElementById('status');let projects=[];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function projectThumbnail(p){
 const components=Array.isArray(p.components)?p.components:[];
 const ordered=[...components.filter(c=>c.id==='full-kit'),...components.filter(c=>c.id!=='full-kit')];
 for(const component of ordered){
  const media=(component.media||[]).find(m=>m.type==='image'&&typeof m.src==='string'&&/^assets\/[A-Za-z0-9_-]+\//.test(m.src));
  if(media)return './'+media.src.split('/').map(encodeURIComponent).join('/');
 }
 return '';
}
function render(){
 let q=document.getElementById('search').value.toLowerCase();cards.replaceChildren();
 const shown=projects.filter(p=>(p.id+' '+p.title+' '+p.board+' '+(p.dimensions||[]).join(' ')).toLowerCase().includes(q));
 shown.forEach(p=>{
  const a=document.createElement('a');a.className='card';a.href='./boxes/'+encodeURIComponent(p.id)+'/';
  a.innerHTML='<div class="cardInfo"><div><span class="id">'+esc(p.id)+'</span><div class="name">'+esc(p.title)+'</div><div class="meta">'+esc((p.dimensions||[]).join(' × '))+' · '+esc(p.board)+'</div></div><div class="open"><span>View project</span></div></div>';
  const thumb=document.createElement('div');thumb.className='cardThumb';
  const src=projectThumbnail(p);
  if(src){const img=document.createElement('img');img.src=src;img.alt='Preview of '+(p.title||p.id);img.loading='lazy';img.decoding='async';img.onerror=()=>{thumb.innerHTML='<span class="cardThumbEmpty">No preview available</span>'};thumb.append(img)}
  else thumb.innerHTML='<span class="cardThumbEmpty">No image yet</span>';
  a.append(thumb);cards.append(a)
 });
 status.textContent=shown.length?'':(q?'No matching projects':'No projects yet')
}
document.getElementById('search').oninput=render;
fetch('./data/projects.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Cannot load projects');return r.json()}).then(d=>{projects=d.projects||[];render()}).catch(e=>{status.textContent=e.message});
</script></body></html>
