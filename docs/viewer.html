/* Viewer polish v9: flush carousel, floating Instagram-like arrows, flat grouped components */
.intro{margin-top:5px}
.gallerytop{justify-content:flex-end;padding:11px 16px 0;border-bottom:0;min-height:32px}
.gallerytag{margin-left:0;background:#f2f1ec;border-radius:7px;padding:6px 10px;font-size:10px}
.stageShell{position:relative;min-width:0}

.slideBtns button:disabled{opacity:0;pointer-events:none}
.slideLabel{display:block;text-align:center;font-weight:700;font-size:11px;color:#555;margin:12px 16px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{padding:10px 14px 16px}
.stage::after{display:none}
.partrow{display:flex;gap:0;overflow-x:auto;max-width:100%;padding:2px 0 5px;scrollbar-width:thin}
.parts{background:#fff;border-top:1px solid #efefeb;padding:15px 18px 16px}
.partrow button{border:1px solid #e4e3df;border-right:0;border-radius:0;background:#f7f7f5;color:#5b5b59;box-shadow:none!important;padding:11px 16px;font-size:11px;font-weight:750;transition:background .12s,color .12s}
.partrow button:first-child{border-radius:10px 0 0 10px}
.partrow button:last-child{border-right:1px solid #e4e3df;border-radius:0 10px 10px 0}
.partrow button:only-child{border-radius:10px;border-right:1px solid #e4e3df}
.partrow button.on{background:#ffcf00;border-color:#eabb00;color:#151515;box-shadow:none}
.partrow button.on+button{border-left-color:#eabb00}
.sectionhead{gap:0}.specifications .sectionhead{margin-bottom:20px}
.specifications .sectionhead h2{font-size:15px;letter-spacing:-.025em}
.dims{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dims div{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-width:0;padding:16px 5px}
.dims small{text-align:center;font-size:10px;margin-bottom:10px}
.dims strong{display:block;max-width:100%;font-size:clamp(16px,2vw,24px);font-weight:850;line-height:1.2;white-space:nowrap;overflow:visible;letter-spacing:-.055em;font-variant-numeric:tabular-nums}
@media(max-width:740px){
  .gallerytop{padding:8px 13px 0;min-height:28px}
  .slideBtns{padding:0 11px}
  .slideBtns button{width:36px;height:36px;font-size:25px}
  .slideLabel{max-width:none;margin:12px 15px 0}
  .parts{padding:14px 14px 17px}
  .partrow button{padding:10px 13px}
  .dims{gap:6px}
  .dims div{padding:14px 3px}
  .dims strong{font-size:clamp(14px,4.7vw,21px)}

/* Viewer refinement v10 — consistent gallery surface, separated chips and bolder dimensions */
.gallery{background:#fff}
.gallery .stage,.gallery .stageShell,.gallery .stage model-viewer{background:#fff!important}
.gallery .stage{background:#fff!important}
.gallery .stage model-viewer{--poster-color:#fff!important}
.gallery .stage::after{display:none}
.gallery .stage img.media{background:transparent}
.gallery .pdfwrap{background:#fff}
.gallery .pdfcanvas{background:#fff}
.partrow{
  display:flex;gap:9px;overflow-x:auto;overflow-y:hidden;
  padding:4px 2px 9px;max-width:100%;min-width:0;
  scrollbar-width:thin;scroll-behavior:smooth;scroll-snap-type:x proximity;

.partrow button,.partrow button:first-child,.partrow button:last-child,.partrow button:only-child{

.partrow button.on,.partrow button.on:first-child,.partrow button.on:last-child{

.partrow button.on+button{border-left-color:#e7e5df}
.partrow button:hover:not(.on){background:#eeede8}
.dims small{
  font-size:clamp(12px,1.12vw,14px);
  line-height:1.2;color:#3a3a37;font-weight:800;
  letter-spacing:-.015em;margin-bottom:12px;
}
.dims div{min-height:100px}
@media(max-width:740px){
  .stage{background:#fff!important}
  .parts{padding:14px 14px 15px}
  .partrow{gap:9px;padding-bottom:8px}
  .partrow button,.partrow button:first-child,.partrow button:last-child,.partrow button:only-child{padding:10px 14px}
  .dims small{font-size:clamp(11px,3.1vw,14px);margin-bottom:10px}
  .dims div{min-height:92px}
}

function showPopup(m){const pop=$('popupBody');pop.replaceChildren();if(m.type==='pdf'){drawPdf(asset(m.src),pop,true,null)}else{const i=document.createElement('img');i.src=asset(m.src);i.alt=m.label||'Preview';pop.append(i)}$('popup').classList.add('open')}
function closePopup(){$('popup').classList.remove('open')}

$('close').onclick=closePopup;$('popup').onclick=e=>{if(e.target===$('popup'))closePopup()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closePopup()});$('prev').onclick=()=>{slide=Math.max(0,slide-1);renderMedia()};$('next').onclick=()=>{slide++;renderMedia()};
let tx=null,ty=null,stageSwiped=false;const area=$('stage');area.addEventListener('touchstart',e=>{if(orbitMode&&e.target.closest('model-viewer'))return;stageSwiped=false;tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});area.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.25){stageSwiped=true;slide=Math.max(0,Math.min(items().length-1,slide+(dx<0?1:-1)));renderMedia();setTimeout(()=>{stageSwiped=false},100)}tx=ty=null},{passive:true});

fetch('./data/projects.json?c='+Date.now()).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{project=(d.projects||[]).find(p=>p.id===id);if(!project)throw Error('Project not found: '+id);document.title=project.id+' / '+project.title+' · CTP';$('title').textContent=project.id+' / '+project.title;let labels=['Length · X','Width · Y','Height · Z'];$('dims').innerHTML=(project.dimensions||[]).map((x,i)=>'<div><small>'+labels[i]+'</small><strong>'+esc(x)+'″</strong></div>').join('');fitDimensionLabels();$('details').innerHTML=[['Die',project.die],['Ref',project.ref],['Box type',project.type],['Board',project.board],['Coating',project.coating],['Printing',project.printing],['Union',project.union]].filter(([k,v])=>!['Die','Ref'].includes(k)||String(v||'').trim()).map(([k,v])=>'<div class="detail'+(['Die','Ref'].includes(k)?' highlight':'')+'"><small>'+esc(k)+'</small><strong>'+esc(v||'—')+'</strong></div>').join('');$('desc').textContent=project.description||'';$('descriptionCard').hidden=!String(project.description||'').trim();if(!project.components?.length)project.components=[{id:'full-kit',name:'Full kit',media:[]}];renderParts();renderMedia()}).catch(e=>{$('title').textContent='Unable to load project';$('stage').textContent=e.message});
</script></body></html>
