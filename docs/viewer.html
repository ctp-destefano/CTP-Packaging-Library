<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTP Packaging Library</title>
<style>:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#181818;background:#f5f5f3}*{box-sizing:border-box}body{margin:0}header{background:#151515;color:#fff;padding:14px max(18px,calc((100vw - 1090px)/2));display:flex;align-items:center;gap:12px}header b{background:#ffcf00;color:#111;padding:10px;border-radius:9px}header strong{font-size:15px}header small{display:block;color:#ffcf00;font-size:9px;letter-spacing:.18em;margin-top:4px}main{max-width:1090px;margin:24px auto;padding:0 16px}h1{font-size:clamp(23px,4vw,33px);letter-spacing:-.04em;margin:0 0 19px}.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(290px,.9fr);gap:17px}.stack{display:flex;flex-direction:column;gap:15px;min-width:0}.card{background:white;border:1px solid #eaeae7;border-radius:16px;overflow:hidden}.pad{padding:19px}h2{font-size:13px;margin:0 0 17px}.stage{height:365px;background:#f1f1ef;position:relative;display:grid;place-items:center;overflow:hidden;touch-action:pan-y}.media{width:100%;height:100%;object-fit:contain;cursor:zoom-in}.media-placeholder{color:#949494;font-size:12px;text-align:center;padding:20px}.stage model-viewer{height:100%;width:100%;--poster-color:#f1f1ef}.slideBtns{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0}.slideBtns button{border:1px solid #e8e8e5;border-radius:50%;background:white;width:31px;height:31px;font-size:20px;cursor:pointer}.slideLabel{font-weight:700;font-size:12px}.dots{display:flex;justify-content:center;gap:7px;padding:11px;min-height:33px}.dots button{height:7px;width:7px;padding:0;border:0;background:#d6d6d3;border-radius:8px;cursor:pointer}.dots button.on{width:20px;background:#151515}.parts{border-top:1px solid #eee;padding:14px 15px}.partlabel{font-size:11px;font-weight:800;margin-bottom:9px}.partrow{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:1px 1px 5px;scrollbar-width:thin}.partrow button{white-space:nowrap;flex:none;padding:9px 13px;border:1px solid #e2e2df;color:#171717;background:#fff;border-radius:9px;cursor:pointer;font-weight:700;font-size:11px}.partrow button.on{background:#ffcf00;border-color:#ffcf00}.dims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}.dims div{background:#f5f5f3;border-radius:10px;padding:13px 9px;min-width:0}.dims small{display:block;color:#777;font-size:10px;margin-bottom:7px}.dims strong{font-size:17px;overflow-wrap:anywhere}.details{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}.detail{border-bottom:1px solid #eee;padding:13px 0}.detail small{display:block;color:#818181;font-size:10px;margin-bottom:5px}.detail strong{font-size:12px}.description{color:#676767;font-size:12px;line-height:1.75}.play{position:absolute;bottom:13px;right:13px;border:0;background:#ffcf00;color:#111;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;z-index:2}.popup{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:30;padding:20px}.popup.open{display:flex}.popup img,.popup iframe{max-width:95vw;max-height:90vh;object-fit:contain;background:white;border:0}.popup iframe{width:min(100%,1100px);height:90vh}.close{position:absolute;right:18px;top:12px;background:#fff;border:0;border-radius:50%;height:32px;width:32px;cursor:pointer;font-size:19px}.notice{color:#777;font-size:12px}.stage object{width:100%;height:100%;border:0}a{color:inherit}@media(max-width:740px){.cols{grid-template-columns:1fr}.stage{height:330px}main{padding:0 12px}h1{padding:0 4px}.pad{padding:16px}.dims strong{font-size:15px}}@media(max-width:370px){.stage{height:285px}}</style>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script></head>
<body><header><b>CTP</b><div><strong>Packaging</strong><small>LIBRARY</small></div></header><main><h1 id="title">Packaging Library</h1><div class="cols"><div class="stack"><section class="card"><div class="stage" id="stage"></div><div class="slideBtns"><button id="prev" aria-label="Previous">‹</button><span class="slideLabel" id="slideLabel"></span><button id="next" aria-label="Next">›</button></div><div class="dots" id="dots"></div><div class="parts"><div class="partlabel">Components</div><div class="partrow" id="parts"></div></div></section></div><div class="stack"><section class="card pad"><h2>Technical specifications</h2><div class="dims" id="dims"></div><div class="details" id="details"></div></section><section class="card pad"><h2>Description</h2><p class="description" id="desc"></p></section></div></div></main><div class="popup" id="popup"><button class="close" id="close" aria-label="Close">×</button><div id="popupBody"></div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);let project,componentIndex=0,slide=0,animationTimer=null;
const id=new URLSearchParams(location.search).get('id')||'CTP042';
const base=new URL('./',location.href);
const asset=u=>{if(!u)return '';if(/^https?:\/\//i.test(u))return u;return new URL(u.replace(/^\/+/,''),base).href};
function current(){return project.components[componentIndex]||{name:'Full kit',media:[]}}
function items(){return (current().media||[]).filter(m=>m&&m.src)}
function stop(){clearTimeout(animationTimer);animationTimer=null}
function renderMedia(){stop();const arr=items();slide=Math.min(Math.max(slide,0),Math.max(arr.length-1,0));const m=arr[slide];const st=$('stage');st.replaceChildren();$('dots').replaceChildren();$('slideLabel').textContent=m?(m.label||({image:'Photo',pdf:'1-up dieline',glb:'3D model'}[m.type]||'View')):'No visual files yet';$('prev').disabled=slide===0;$('next').disabled=slide>=arr.length-1;
if(!m){const e=document.createElement('div');e.className='media-placeholder';e.textContent='Visual content will appear here';st.append(e)}
else if(m.type==='glb'){const v=document.createElement('model-viewer');v.src=asset(m.src);v.setAttribute('camera-controls','');v.setAttribute('touch-action','pan-y');v.setAttribute('shadow-intensity','0.6');v.setAttribute('interaction-prompt','none');v.setAttribute('alt','3D model');st.append(v);if(m.assembly){let play=document.createElement('button');play.className='play';play.textContent='▶';play.title='Play assembly';play.onclick=()=>{if(v.availableAnimations?.length){v.animationName=m.animationName||v.availableAnimations[0];v.currentTime=0;v.play();let duration=v.duration||2;stop();animationTimer=setTimeout(()=>{v.pause();v.currentTime=0},duration*1000)}else alert('No assembly animation found in this GLB')};st.append(play)}}
else if(m.type==='pdf'){const frame=document.createElement('object');frame.data=asset(m.src)+'#toolbar=0&navpanes=0';frame.type='application/pdf';st.append(frame);const open=document.createElement('button');open.className='play';open.textContent='⛶';open.title='Expand dieline';open.onclick=()=>showPopup(m);st.append(open)}
else{const im=document.createElement('img');im.className='media';im.src=asset(m.src);im.alt=m.label||'Packaging view';im.onclick=()=>showPopup(m);st.append(im)}
arr.forEach((_,i)=>{const d=document.createElement('button');d.className=i===slide?'on':'';d.ariaLabel='View '+(i+1);d.onclick=()=>{slide=i;renderMedia()};$('dots').append(d)});
}
function renderParts(){const p=$('parts');p.replaceChildren();(project.components||[]).forEach((c,i)=>{let b=document.createElement('button');b.textContent=c.name;b.className=i===componentIndex?'on':'';b.onclick=()=>{componentIndex=i;slide=0;renderParts();renderMedia()};p.append(b)})}
function showPopup(m){const pop=$('popupBody');pop.replaceChildren();if(m.type==='pdf'){const f=document.createElement('iframe');f.src=asset(m.src)+'#toolbar=0';pop.append(f)}else{const i=document.createElement('img');i.src=asset(m.src);i.alt=m.label||'Preview';pop.append(i)}$('popup').classList.add('open')}
function closePopup(){$('popup').classList.remove('open')}
$('close').onclick=closePopup;$('popup').onclick=e=>{if(e.target===$('popup'))closePopup()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closePopup()});$('prev').onclick=()=>{slide=Math.max(0,slide-1);renderMedia()};$('next').onclick=()=>{slide++;renderMedia()};
let tx=null,ty=null;const area=$('stage');area.addEventListener('touchstart',e=>{if(e.target.closest('model-viewer'))return;tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});area.addEventListener('touchend',e=>{if(tx===null)return;let dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){slide=Math.max(0,Math.min(items().length-1,slide+(dx<0?1:-1)));renderMedia()}tx=ty=null},{passive:true});
fetch('./data/projects.json?c='+Date.now()).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{project=(d.projects||[]).find(p=>p.id===id);if(!project)throw Error('Project not found: '+id);document.title=project.id+' / '+project.title+' · CTP';$('title').textContent=project.id+' / '+project.title;let labels=['Length · X','Width · Y','Height · Z'];$('dims').innerHTML=(project.dimensions||[]).map((x,i)=>'<div><small>'+labels[i]+'</small><strong>'+esc(x)+'″</strong></div>').join('');$('details').innerHTML=[['Box type',project.type],['Board',project.board],['Coating',project.coating],['Printing',project.printing],['Union',project.union]].map(([k,v])=>'<div class="detail"><small>'+esc(k)+'</small><strong>'+esc(v||'—')+'</strong></div>').join('');$('desc').textContent=project.description||'';if(!project.components?.length)project.components=[{id:'full-kit',name:'Full kit',media:[]}];renderParts();renderMedia()}).catch(e=>{$('title').textContent='Unable to load project';$('stage').textContent=e.message});
</script></body></html>
